<title id="title">Factory Method no CloudReports</title>
<desc id="desc">ExportacaoCSV e ExportacaoPDF herdam de Exportacao e criam RelatorioCSV e RelatorioPDF. Os dois relatórios herdam de Relatorio. Exportacao usa Relatorio.</desc>
